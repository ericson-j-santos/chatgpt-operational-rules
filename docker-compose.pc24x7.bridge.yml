name: todo-global-24x7

services:
  db_bridge:
    profiles: ["rollback"]
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: services/todo_gateway/Dockerfile.pc24x7
    restart: unless-stopped
    environment:
      DB_BRIDGE_LISTEN_HOST: "0.0.0.0"
      DB_BRIDGE_LISTEN_PORT: "15432"
      DB_BRIDGE_UPSTREAM_HOST: "db"
      DB_BRIDGE_UPSTREAM_PORT: "5432"
      DB_BRIDGE_ALLOWED_REMOTE_IPS: ${DB_BRIDGE_ALLOWED_REMOTE_IPS:-172.19.0.1,192.168.1.60,127.0.0.1}
    command: ["python", "-m", "scripts.pc24x7_db_bridge_dev"]
    ports:
      - "192.168.1.45:${DB_BRIDGE_HOST_PORT:-15432}:15432"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',15432),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
