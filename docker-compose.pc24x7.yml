name: todo-global-24x7

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - todo_global_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TODO_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: services/todo_gateway/Dockerfile.pc24x7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TODO_GATEWAY_TOKEN: ${TODO_GATEWAY_TOKEN}
      GITLAB_WEBHOOK_TOKEN: ${GITLAB_WEBHOOK_TOKEN:-}
      GITLAB_WEBHOOK_PROJECT: ${GITLAB_WEBHOOK_PROJECT:-}
      PORT: "8000"
    ports:
      - "127.0.0.1:${TODO_GATEWAY_PORT:-8094}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: services/todo_gateway/Dockerfile.pc24x7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["python", "scripts/continuation_worker.py", "--interval-seconds", "5"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,psycopg; c=psycopg.connect(os.environ['DATABASE_URL']); c.execute('SELECT 1'); c.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ingest:
    build:
      context: .
      dockerfile: services/todo_gateway/Dockerfile.pc24x7
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      TODO_GATEWAY_URL: http://gateway:8000
      TODO_GATEWAY_TOKEN: ${TODO_GATEWAY_TOKEN}
      POWER_PLATFORM_TENANT_ID: ${POWER_PLATFORM_TENANT_ID:-}
      POWER_PLATFORM_CLIENT_ID: ${POWER_PLATFORM_CLIENT_ID:-}
      POWER_PLATFORM_CLIENT_SECRET: ${POWER_PLATFORM_CLIENT_SECRET:-}
      PLANNER_TEAMS_DEV_TEAM_ID: ${PLANNER_TEAMS_DEV_TEAM_ID:-}
      PLANNER_TEAMS_DEV_CHANNEL_ID: ${PLANNER_TEAMS_DEV_CHANNEL_ID:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/v4}
      GITLAB_PROJECT_ID: ${GITLAB_PROJECT_ID:-}
      CONTINUOUS_INGEST_STATE_FILE: /var/lib/continuous-ingest/state.json
    command: ["python", "-m", "scripts.continuous_source_ingest", "--interval-seconds", "30"]
    volumes:
      - continuous_ingest_state:/var/lib/continuous-ingest

volumes:
  todo_global_pgdata:
    name: todo_global_pgdata
  continuous_ingest_state:
    name: continuous_ingest_state
