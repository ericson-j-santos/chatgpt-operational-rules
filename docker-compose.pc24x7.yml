name: todo-global-24x7

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - todo_global_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: services/todo_gateway/Dockerfile.pc24x7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TODO_GATEWAY_TOKEN: ${TODO_GATEWAY_TOKEN}
      PORT: "8000"
    ports:
      - "127.0.0.1:${TODO_GATEWAY_PORT:-8091}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  todo_global_pgdata:
    name: todo_global_pgdata
