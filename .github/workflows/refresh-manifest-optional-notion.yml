name: Refresh manifest optional Notion

on:
  push:
    branches:
      - fix/todo-gateway-optional-notion

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/todo-gateway-optional-notion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate final manifest safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/generate_manifest.py
          git add MANIFEST.json
          git commit -m 'chore: refresh manifest before helper removal'
          git rm .github/workflows/refresh-manifest-optional-notion.yml
          git commit -m 'chore: remove temporary manifest workflow'
          python scripts/generate_manifest.py
          git add MANIFEST.json
          git commit -m 'chore: refresh final manifest for optional Notion projection'
          git push origin HEAD:fix/todo-gateway-optional-notion
