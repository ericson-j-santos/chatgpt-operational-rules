name: Reconcile PR30 with current main

on:
  push:
    branches:
      - fix/host-health-runtime-map-issue1649

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/host-health-runtime-map-issue1649
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary workflow and regenerate manifest
        run: |
          git rm .github/workflows/reconcile-pr30.yml
          python scripts/generate_manifest.py
      - name: Validate reconciled tree
        run: |
          python scripts/validate_rules.py --self-test
          python -m unittest -v tests/test_host_bootstrap.py tests/test_host_health_check.py
      - name: Commit reconciled manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MANIFEST.json
          git commit -m "fix(ci): reconcile PR30 with current main"
          git push origin HEAD:fix/host-health-runtime-map-issue1649
