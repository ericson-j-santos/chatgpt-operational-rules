name: Finalize PR30 manifest

on:
  push:
    branches:
      - fix/host-health-runtime-map-issue1649

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/host-health-runtime-map-issue1649
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove temporary workflow and regenerate final manifest
        run: |
          git rm .github/workflows/finalize-pr30-manifest.yml
          python scripts/generate_manifest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.json
          git commit -m 'chore: regenerate PR30 manifest after reconciliation'
          git push origin HEAD:fix/host-health-runtime-map-issue1649
