name: Refresh manifest host health

on:
  push:
    branches:
      - feat/command-gateway-host-health-issue1649

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/command-gateway-host-health-issue1649
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate final manifest
        run: |
          rm .github/workflows/refresh-manifest-host-health.yml
          python scripts/generate_manifest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: refresh manifest for host health check'
          git push origin HEAD:feat/command-gateway-host-health-issue1649
