name: Validate Operational Rules
run-name: Operational Rules / ${{ inputs.correlation_id || github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA authorized for this run
        required: true
        type: string
      correlation_id:
        description: Unique governed-dispatch correlation identifier
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Rules, Gateway, Session Bootstrap and E2E gate
    outputs:
      manual_pr_verified: ${{ steps.bind.outputs.manual_pr_verified }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      triage-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: todo_reservation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d todo_reservation_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Bind manual dispatch to its authorized revision
        id: bind
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_CORRELATION_ID: ${{ inputs.correlation_id }}
          DISPATCH_EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_REF: ${{ github.ref_name }}
          DISPATCH_FULL_REF: ${{ github.ref }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RESOLVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_ACTOR" != "$REPOSITORY_OWNER" || "$DISPATCH_TRIGGERING_ACTOR" != "$REPOSITORY_OWNER" ]]; then
            echo "Manual dispatch requires repository owner identity" >&2
            exit 1
          fi
          if [[ "$DISPATCH_REF_TYPE" != "branch" || "$DISPATCH_FULL_REF" != "refs/heads/$DISPATCH_REF" ]]; then
            echo "Manual dispatch requires a branch ref" >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_CORRELATION_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]]; then
            echo "Invalid correlation identifier" >&2
            exit 1
          fi
          if [[ ! "$DISPATCH_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected SHA" >&2
            exit 1
          fi
          if [[ "$RESOLVED_SHA" != "$DISPATCH_EXPECTED_SHA" ]]; then
            echo "Dispatched revision does not match the authorized SHA" >&2
            exit 1
          fi
          echo "manual_pr_verified=false" >> "$GITHUB_OUTPUT"
          if [[ "$DISPATCH_REF" != "main" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" > "$RUNNER_TEMP/manual-prs.json"
            MATCH_COUNT="$(jq --arg ref "$DISPATCH_REF" --arg sha "$DISPATCH_EXPECTED_SHA" --arg repo "$GITHUB_REPOSITORY" --arg owner "$GITHUB_REPOSITORY_OWNER" '[.[] | select(.state == "open" and .draft == true and .base.ref == "main" and .head.ref == $ref and .head.sha == $sha and .head.repo.full_name == $repo and .user.login == $owner)] | length' "$RUNNER_TEMP/manual-prs.json")"
            if [[ "$MATCH_COUNT" != "1" ]]; then
              echo "Manual non-main dispatch requires one exact owner draft PR" >&2
              exit 1
            fi
            echo "manual_pr_verified=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate rules and negative self-test
        run: python scripts/validate_rules.py --self-test
      - name: Run one-time host power exception tests
        run: python -m unittest -v tests/test_owner_host_power_once.py
      - name: Run one-time remote host power exception tests
        run: python -m unittest -v tests/test_owner_remote_host_power_once.py
      - name: Run specific Risk 3 action authorization tests
        run: python -m unittest -v tests/test_owner_risk3_specific_action.py
      - name: Run PR CI Self Heal unit tests
        run: python -m unittest -v tests/test_pr_ci_self_heal.py
      - name: Run governed workflow dispatch unit tests
        run: python -m unittest -v tests/test_dispatch_workflow_governed.py
      - name: Run repository governance remediation unit tests
        run: python -m unittest -v tests/test_repository_governance_remediation.py
      - name: Run GitHub schedule bridge unit tests
        run: python -m unittest -v tests/test_github_schedule_bridge.py
      - name: Run continuation worker and execution lane unit tests
        run: python -m unittest -v tests/test_continuation_worker.py tests/test_execution_lane_client.py
      - name: Run execution lane isolated E2E
        run: python -m scripts.execution_lane_e2e
      - name: Run Command Gateway unit tests
        run: python -m unittest -v tests/test_command_gateway.py tests/test_command_gateway_posix_policy.py tests/test_validate_rules_policy_profiles.py tests/test_governed_branch_update_policy.py tests/test_update_branch_fast_forward_governed.py
      - name: Validate exact Noteri WSL running-only gate (Linux contract)
        run: python -m unittest -v tests/test_noteri_wsl_running_status.py
      - name: Run dormant Render PostgreSQL preservation safety tests
        run: python -m unittest -v tests/test_render_postgres_preservation.py
      - name: Run restricted host health unit tests
        run: python -m unittest -v tests/test_host_health_check.py
      - name: Run Command Gateway E2E
        run: python scripts/command_gateway_e2e.py
      - name: Run Session Bootstrap unit tests
        run: python -m unittest -v tests/test_session_bootstrap.py
      - name: Run Session Bootstrap E2E
        run: python scripts/session_bootstrap_e2e.py
      - name: Run Session Preflight unit tests
        run: python -m unittest -v tests/test_session_preflight.py
      - name: Run Session Preflight E2E
        run: python scripts/session_preflight_e2e.py
      - name: Run Session Launcher unit tests
        run: python -m unittest discover -v -s tests -p 'test_session_launcher*.py'
      - name: Run Session Launcher E2E
        run: python scripts/session_launcher_e2e.py
      - name: Run Dual Host Preflight unit tests
        run: python -m unittest -v tests/test_dual_host_preflight.py
      - name: Run self-hosted runner version preflight unit tests
        run: python -m unittest -v tests/test_runner_version_preflight.py
      - name: Run Host Operating Profile unit tests
        run: python -m unittest -v tests/test_host_operating_profile.py
      - name: Run quota-aware tool routing unit tests
        run: python -m unittest -v tests/test_tool_router.py
      - name: Run Remote Desktop Commander resilience unit tests
        run: python -m unittest -v tests/test_rdc_host_fix.py tests/test_rdc_task_resilience.py
      - name: Run Remote Desktop Commander semantic outcome tests
        run: python -m unittest -v tests/test_rdc_semantic_result.py
      - name: Run Remote Desktop Commander owner arbitration tests
        run: python -m unittest -v tests/test_rdc_owner_arbitration.py
      - name: Run Host Bootstrap unit tests
        run: python -m unittest -v tests/test_host_bootstrap.py tests/test_update_command_gateway_host.py
      - name: Run Host Bootstrap E2E
        run: python scripts/host_bootstrap_e2e.py
      - name: Validate new-host inventory and isolated onboarding E2E
        run: python -m unittest -v tests/test_host_onboarding_report.py
      - name: Validate native host capacity probe and negative controls
        run: python -m unittest -v tests/test_native_host_capacity_probe.py
      - name: Validate Lenovo governed bootstrap inventory workflow
        run: python -m unittest -v tests/test_lenovo_command_gateway_bootstrap_inventory_workflow.py
      - name: Run TodoEvent unit tests
        run: python -m unittest -v tests/test_todo_event_bus.py
      - name: Run TodoEvent E2E
        run: python scripts/todo_event_bus_e2e.py
      - name: Install TODO Gateway dependencies
        run: python -m pip install --disable-pip-version-check -r services/todo_gateway/requirements.txt
      - name: Run TODO Gateway unit tests
        run: python -m unittest -v tests/test_todo_gateway_service.py tests/test_notion_sink_integrity.py tests/test_todo_control_plane.py tests/test_gitlab_webhook.py
      - name: Run PC24x7 canonical runtime and anti-regression tests
        run: python -m unittest -v tests/test_todo_gateway_pc24x7.py
      - name: Run native Debian installer contract tests
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5
          python -m pytest -q tests/test_todo_gateway_debian_systemd.py tests/test_todo_gateway_debian_installer_isolated_e2e.py tests/test_todo_sqlite_sink_replay.py
      - name: Run TODO Gateway service-main tests
        run: python -m unittest -v tests/test_todo_gateway_service_main.py
      - name: Run legacy Render contingency tests
        run: python -m unittest -v tests/test_render_todo_gateway_bootstrap.py
      - name: Run TODO Gateway E2E
        run: python -m scripts.todo_gateway_e2e
      - name: Run shared triage reservation E2E with real PostgreSQL
        env:
          TRIAGE_TEST_DSN: host=127.0.0.1 port=${{ job.services.triage-postgres.ports[5432] }} dbname=todo_reservation_test user=postgres password=disposable-ci-only connect_timeout=5
          TRIAGE_GATEWAY_POLICY_PROFILE: posix
        run: python scripts/triage_reservation_e2e.py
      - name: Preserve triage reservation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: triage-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/triage-reservation-evidence.json
          if-no-files-found: error
          retention-days: 7

  gateway-windows-policy:
    name: Command Gateway Windows policy compatibility
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact revision without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate native Windows policy loading and shared path controls
        run: python -m unittest -v tests/test_command_gateway_posix_policy.py
      - name: Validate exact Noteri WSL running-only gate (Windows contract)
        run: python -m unittest -v tests/test_noteri_wsl_running_status.py
      - name: Validate SHA-bound local clone and failure controls on Windows
        run: python -m unittest -v tests.test_session_launcher.SessionLauncherTests.test_isolated_local_clone_uses_pinned_commit_without_network_fetch tests.test_session_launcher.SessionLauncherTests.test_restricted_fetch_different_sha_still_blocks
      - name: Validate transactional Command Gateway runtime update on Windows
        run: python -m unittest -v tests/test_update_command_gateway_host.py

  debian-installer-isolated:
    name: Debian installer isolated systemd homologation
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          (
            github.ref == 'refs/heads/main' ||
            needs.validate.outputs.manual_pr_verified == 'true'
          )
        ) ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == true
        )
      )
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CORRELATION_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.correlation_id || format('gha-{0}-{1}', github.run_id, github.run_attempt) }}
      EVENT_NAME: ${{ github.event_name }}
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}
      FULL_REF: ${{ github.ref }}
      REF_TYPE: ${{ github.ref_type }}
      ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
      PR_DRAFT: ${{ github.event.pull_request.draft && 'true' || 'false' }}
      MANUAL_PR_VERIFIED: ${{ needs.validate.outputs.manual_pr_verified || 'false' }}
    steps:
      - name: Checkout exact revision without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Fail closed unless the target is a clean disposable systemd VM
        env:
          TODO22_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          sudo env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/root \
            LANG=C.UTF-8 \
            DEBIAN_FRONTEND=noninteractive \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_EVENT_NAME="$EVENT_NAME" \
            TODO22_SOURCE_REF="$SOURCE_REF" \
            TODO22_FULL_REF="$FULL_REF" \
            TODO22_REF_TYPE="$REF_TYPE" \
            TODO22_ACTOR="$ACTOR" \
            TODO22_TRIGGERING_ACTOR="$TRIGGERING_ACTOR" \
            TODO22_PR_HEAD_REPOSITORY="$PR_HEAD_REPOSITORY" \
            TODO22_PR_AUTHOR="$PR_AUTHOR" \
            TODO22_PR_BASE_REF="$PR_BASE_REF" \
            TODO22_PR_DRAFT="$PR_DRAFT" \
            TODO22_MANUAL_PR_VERIFIED="$MANUAL_PR_VERIFIED" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            TODO22_RUNNER_ENVIRONMENT="$TODO22_RUNNER_ENVIRONMENT" \
            /usr/bin/python3 scripts/todo_gateway_debian_installer_isolated_e2e.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --expected-sha "$EXPECTED_SHA" \
              --correlation-id "$CORRELATION_ID" \
              --preflight-only

      - name: Install argv audit dependency on the disposable runner
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends strace
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install, replay and inject readiness failure
        env:
          TODO22_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          EVIDENCE_PATH: ${{ runner.temp }}/todo22-debian-installer-evidence.json
        run: |
          sudo env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/root \
            LANG=C.UTF-8 \
            DEBIAN_FRONTEND=noninteractive \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_EVENT_NAME="$EVENT_NAME" \
            TODO22_SOURCE_REF="$SOURCE_REF" \
            TODO22_FULL_REF="$FULL_REF" \
            TODO22_REF_TYPE="$REF_TYPE" \
            TODO22_ACTOR="$ACTOR" \
            TODO22_TRIGGERING_ACTOR="$TRIGGERING_ACTOR" \
            TODO22_PR_HEAD_REPOSITORY="$PR_HEAD_REPOSITORY" \
            TODO22_PR_AUTHOR="$PR_AUTHOR" \
            TODO22_PR_BASE_REF="$PR_BASE_REF" \
            TODO22_PR_DRAFT="$PR_DRAFT" \
            TODO22_MANUAL_PR_VERIFIED="$MANUAL_PR_VERIFIED" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            TODO22_RUNNER_ENVIRONMENT="$TODO22_RUNNER_ENVIRONMENT" \
            /usr/bin/python3 scripts/todo_gateway_debian_installer_isolated_e2e.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --expected-sha "$EXPECTED_SHA" \
              --correlation-id "$CORRELATION_ID" \
              --evidence-path "$EVIDENCE_PATH"

      - name: Preserve isolated installer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: todo22-debian-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/todo22-debian-installer-evidence.json
          if-no-files-found: error
          retention-days: 7
