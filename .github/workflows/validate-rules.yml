name: Validate Operational Rules

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Rules, Gateway, Session Bootstrap and E2E gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate rules and negative self-test
        run: python scripts/validate_rules.py --self-test
      - name: Run one-time host power exception tests
        run: python -m unittest -v tests/test_owner_host_power_once.py
      - name: Run PR CI Self Heal unit tests
        run: python -m unittest -v tests/test_pr_ci_self_heal.py
      - name: Run governed workflow dispatch unit tests
        run: python -m unittest -v tests/test_dispatch_workflow_governed.py
      - name: Run GitHub schedule bridge unit tests
        run: python -m unittest -v tests/test_github_schedule_bridge.py
      - name: Run Command Gateway unit tests
        run: python -m unittest -v tests/test_command_gateway.py
      - name: Run restricted host health unit tests
        run: python -m unittest -v tests/test_host_health_check.py
      - name: Run Command Gateway E2E
        run: python scripts/command_gateway_e2e.py
      - name: Run Session Bootstrap unit tests
        run: python -m unittest -v tests/test_session_bootstrap.py
      - name: Run Session Bootstrap E2E
        run: python scripts/session_bootstrap_e2e.py
      - name: Run Session Preflight unit tests
        run: python -m unittest -v tests/test_session_preflight.py
      - name: Run Session Preflight E2E
        run: python scripts/session_preflight_e2e.py
      - name: Run Session Launcher unit tests
        run: python -m unittest -v tests/test_session_launcher.py
      - name: Run Session Launcher E2E
        run: python scripts/session_launcher_e2e.py
      - name: Run Dual Host Preflight unit tests
        run: python -m unittest -v tests/test_dual_host_preflight.py
      - name: Run Host Operating Profile unit tests
        run: python -m unittest -v tests/test_host_operating_profile.py
      - name: Run Remote Desktop Commander resilience unit tests
        run: python -m unittest -v tests/test_rdc_host_fix.py tests/test_rdc_task_resilience.py
      - name: Run Host Bootstrap unit tests
        run: python -m unittest -v tests/test_host_bootstrap.py
      - name: Run Host Bootstrap E2E
        run: python scripts/host_bootstrap_e2e.py
      - name: Run TodoEvent unit tests
        run: python -m unittest -v tests/test_todo_event_bus.py
      - name: Run TodoEvent E2E
        run: python scripts/todo_event_bus_e2e.py
      - name: Install TODO Gateway dependencies
        run: python -m pip install --disable-pip-version-check -r services/todo_gateway/requirements.txt
      - name: Run TODO Gateway unit tests
        run: python -m unittest -v tests/test_todo_gateway_service.py tests/test_todo_control_plane.py tests/test_gitlab_webhook.py
      - name: Run PC24x7 canonical runtime and anti-regression tests
        run: python -m unittest -v tests/test_todo_gateway_pc24x7.py
      - name: Run TODO Gateway service-main tests
        run: python -m unittest -v tests/test_todo_gateway_service_main.py
      - name: Run legacy Render contingency tests
        run: python -m unittest -v tests/test_render_todo_gateway_bootstrap.py
      - name: Run TODO Gateway E2E
        run: python -m scripts.todo_gateway_e2e