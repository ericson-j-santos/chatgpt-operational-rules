name: Patch host health runtime map

on:
  workflow_dispatch:
  push:
    branches:
      - fix/host-health-runtime-map-issue1649

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/host-health-runtime-map-issue1649
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical runtime map
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/install_command_gateway_host.py')
          s = p.read_text(encoding='utf-8')
          needle = '    "scripts/command_gateway.py": "bin/command_gateway.py",\n'
          addition = needle + '    "scripts/host_health_check.py": "bin/host_health_check.py",\n'
          if '"scripts/host_health_check.py": "bin/host_health_check.py"' not in s:
              if needle not in s:
                  raise SystemExit('runtime map anchor not found')
              p.write_text(s.replace(needle, addition, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow from tracked tree
        run: git rm .github/workflows/patch-host-health-runtime-map.yml
      - name: Regenerate manifest
        run: python scripts/generate_manifest.py
      - name: Validate before commit
        run: |
          python scripts/validate_rules.py --self-test
          python -m unittest -v tests/test_host_bootstrap.py tests/test_host_health_check.py
      - name: Commit governed patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/install_command_gateway_host.py MANIFEST.json
          git commit -m "fix: package host health helper in gateway runtime"
          git push origin HEAD:fix/host-health-runtime-map-issue1649
