name: Refresh S4U E2E hotfix manifest once

on:
  push:
    branches:
      - fix/todo-global-s4u-e2e-path-freshness-20260916

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/todo-global-s4u-e2e-path-freshness-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate focused tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/test_todo_gateway_windows_s4u.py -q -p no:cacheprovider
      - name: Remove one-shot workflow and refresh manifest
        run: |
          rm -f .github/workflows/refresh-manifest-s4u-e2e-hotfix-once.yml
          python scripts/generate_manifest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore: refresh manifest for S4U E2E hotfix'
          git push origin HEAD:fix/todo-global-s4u-e2e-path-freshness-20260916
