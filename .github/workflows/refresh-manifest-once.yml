name: Refresh Manifest Once

on:
  push:
    branches:
      - feat/ai-control-plane-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          ref: feat/ai-control-plane-v1
          fetch-depth: 0
      - name: Remove one-shot workflow before manifest generation
        run: git rm .github/workflows/refresh-manifest-once.yml
      - name: Regenerate canonical manifest
        run: python scripts/generate_manifest.py
      - name: Validate regenerated manifest
        run: python scripts/validate_rules.py --self-test
      - name: Commit regenerated manifest and self-removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.json
          git diff --cached --check
          git commit -m "chore: refresh integrity manifest"
          git push origin HEAD:feat/ai-control-plane-v1
