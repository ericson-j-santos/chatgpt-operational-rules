name: Monitor - Official AI Agent and RAG Security

on:
  pull_request:
    paths:
      - ".github/workflows/security-agent-rag-official-monitor.yml"
      - "scripts/security_agent_rag_monitor.py"
      - "tests/test_security_agent_rag_monitor.py"
      - "MANIFEST.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-agent-rag-official-monitor.yml"
      - "scripts/security_agent_rag_monitor.py"
      - "tests/test_security_agent_rag_monitor.py"
      - "MANIFEST.json"
  schedule:
    # 08:23 America/Sao_Paulo (UTC-3), avoid congested top of hour.
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-agent-rag-official-monitor
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Compile and test monitoring contract
        run: |
          python3 -m py_compile scripts/security_agent_rag_monitor.py
          python3 -m unittest -v tests/test_security_agent_rag_monitor.py

  monitor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact run SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate and run official-source monitor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/security_agent_rag_monitor.py
          python3 -m unittest -v tests/test_security_agent_rag_monitor.py
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python3 scripts/security_agent_rag_monitor.py --repo "$GITHUB_REPOSITORY" --dry-run
          else
            python3 scripts/security_agent_rag_monitor.py --repo "$GITHUB_REPOSITORY"
          fi
