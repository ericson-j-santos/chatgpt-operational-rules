name: Refresh headless E2E retry manifest once

on:
  push:
    branches:
      - fix/todo-global-headless-observability-20260916
    paths:
      - .github/workflows/refresh-headless-e2e-retry-manifest-once.yml

permissions:
  contents: write

jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/todo-global-headless-observability-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate focused headless tests
        run: python -m pytest tests/test_todo_gateway_windows_s4u.py -q -p no:cacheprovider
      - name: Refresh manifest and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-headless-e2e-retry-manifest-once.yml
          python scripts/generate_manifest.py
          python scripts/validate_rules.py --self-test
          git add MANIFEST.json
          git commit -m 'chore: refresh manifest for headless E2E retry'
          git push origin HEAD:fix/todo-global-headless-observability-20260916
